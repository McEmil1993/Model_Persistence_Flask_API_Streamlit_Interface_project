[theme]
base = "light"
primaryColor = "#0A0A0A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#0A0A0A"
font = "Geist"
headingFont = "Geist Pixel Square"
codeFont = "Geist Mono"
headingFontSizes = ["2.5rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [400, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#0A0A0A", "#A3A3A3"]

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Pixel Square"
url = "app/static/fonts/GeistPixel-Square.woff2"
weight = 400

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true
